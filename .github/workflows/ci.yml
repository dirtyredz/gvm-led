name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch: {}

permissions: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Cache Gradle downloads and wrapper
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src/mobile/android/**/*.gradle*', 'src/mobile/android/gradle/**') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Select Java 21 and pinned Android tools
        run: |
          test -x "$JAVA_HOME_21_X64/bin/java"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Android fast gate
        run: |
          test -x src/mobile/android/gradlew
          trap 'src/mobile/android/gradlew -p src/mobile/android --stop' EXIT
          src/mobile/android/gradlew -p src/mobile/android --dependency-verification strict testDebugUnitTest assembleDebug lintDebug

  # Release tooling (src/mobile/releases, scripts/mobile): node --test with fakes only; no
  # GitHub, vault or build-tools access. Mirrors command-deck's release contract tests in CI.
  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.20.0"
          cache: npm
      - name: Install release-tooling dependencies (lockfile)
        run: npm ci --no-audit --no-fund
      - name: Release-tooling tests
        run: npm test
